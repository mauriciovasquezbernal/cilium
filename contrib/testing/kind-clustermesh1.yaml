### NATIVE ###

#routingMode: native
#autoDirectNodeRoutes: true
#ipv4NativeRoutingCIDR: 10.1.0.0/16
#ipv6NativeRoutingCIDR: fd00:10:1::/48

### HYBRID ###
routingMode: hybrid
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.1.0.0/16
ipv6NativeRoutingCIDR: fd00:10:1::/48
extraConfig:
  subnet-topology: "10.1.0.0/16;10.2.0.0/16"

cluster:
  name: clustermesh1
  id: 1
debug:
  enabled: true
image:
  pullPolicy: Never
operator:
  image:
    pullPolicy: Never
ipam:
  mode: kubernetes
ipv6:
  enabled: true
ipv4:
  enabled: true
bpf:
  monitorAggregation: none
livenessProbe:
  failureThreshold: 9999
readinessProbe:
  failureThreshold: 9999
startupProbe:
  failureThreshold: 9999
clustermesh:
  useAPIServer: true
  config:
    enabled: true
  apiserver:
    image:
      pullPolicy: Never
    service:
      nodePort: 32379
    readinessProbe:
      periodSeconds: 1
    kvstoremesh:
      readinessProbe:
        periodSeconds: 1
